<svg viewBox="0 0 1000 700" width="100%" height="650" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; background-color: #0f172a; border-radius: 12px;">
  <defs>
    <pattern id="gridHydraulic" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="0.75" />
    </pattern>
    <linearGradient id="coldWaterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="hotWaterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <linearGradient id="solarTankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glowHydraulic" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.35" flood-color="#38bdf8" />
    </filter>
  </defs>

  <rect width="1000" height="700" fill="#0f172a" />
  <rect width="1000" height="700" fill="url(#gridHydraulic)" />

  <!-- HEADER DEL DIAGRAMA -->
  <g id="header-hidraulico" transform="translate(40, 30)">
    <rect x="0" y="0" width="920" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="25" cy="25" r="14" fill="#0284c7" />
    <path d="M 25 15 C 21 21, 18 24, 18 27 A 7 7 0 0 0 32 27 C 32 24, 29 21, 25 15 Z" fill="#ffffff" />
    <text x="50" y="24" font-size="14" font-weight="900" fill="#f8fafc">DIAGRAMA UNIFILAR E ISOMÉTRICO HIDRÁULICO INTEGRAL</text>
    <text x="50" y="40" font-size="10" font-weight="600" fill="#94a3b8">Cisterna 5,000L • Presurizador Inverter 3.5 bar • Calentador Solar 200L • Bypass Modulante • Recirculación Cero Desperdicio</text>
  </g>

  <!-- LÍNEAS GUÍA DE NIVELES (PB, PA, ROOF) -->
  <g id="niveles-referencia" opacity="0.4">
    <!-- Nivel Azotea -->
    <line x1="60" y1="180" x2="940" y2="180" stroke="#64748b" stroke-width="1" stroke-dasharray="6,4" />
    <text x="70" y="174" font-size="9" font-weight="800" fill="#38bdf8">NIVEL +6.00 m (AZOTEA &amp; ROOF GARDEN)</text>

    <!-- Nivel Planta Alta -->
    <line x1="60" y1="360" x2="940" y2="360" stroke="#64748b" stroke-width="1" stroke-dasharray="6,4" />
    <text x="70" y="354" font-size="9" font-weight="800" fill="#38bdf8">NIVEL +3.00 m (PLANTA ALTA)</text>

    <!-- Nivel Planta Baja -->
    <line x1="60" y1="540" x2="940" y2="540" stroke="#64748b" stroke-width="1" stroke-dasharray="6,4" />
    <text x="70" y="534" font-size="9" font-weight="800" fill="#38bdf8">NIVEL ±0.00 m / -0.15 m (PLANTA BAJA &amp; CISTERNA)</text>
  </g>

  <!-- ====================================================================
       1. SUMINISTRO MUNICIPAL Y CISTERNA 5,000 L (PLANTA BAJA)
       ==================================================================== -->
  <g id="suministro-y-cisterna" transform="translate(60, 560)">
    <!-- Acometida Municipal -->
    <rect x="0" y="20" width="70" height="40" rx="4" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" />
    <text x="35" y="36" text-anchor="middle" font-size="8" font-weight="800" fill="#38bdf8">RED MUNICIPAL</text>
    <text x="35" y="48" text-anchor="middle" font-size="7" font-weight="600" fill="#94a3b8">Toma 1/2" Cobre</text>

    <!-- Tubería hacia cisterna con Válvula Flotador -->
    <path d="M 70 40 L 110 40 L 110 65 L 140 65" fill="none" stroke="#0284c7" stroke-width="3" />
    <circle cx="140" cy="65" r="4" fill="#38bdf8" />

    <!-- Cisterna Subterránea 5,000 L -->
    <rect x="140" y="10" width="130" height="90" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="2" opacity="0.85" />
    <rect x="145" y="30" width="120" height="65" rx="3" fill="#0284c7" opacity="0.9" />
    <!-- Líneas de nivel de agua -->
    <path d="M 145 35 Q 175 32, 205 35 T 265 35" fill="none" stroke="#bae6fd" stroke-width="1.5" />
    <text x="205" y="55" text-anchor="middle" font-size="10" font-weight="900" fill="#ffffff">CISTERNA 5,000 L</text>
    <text x="205" y="70" text-anchor="middle" font-size="7.5" font-weight="700" fill="#e0f2fe">Sensor Nivel Ultrasónico</text>
    <text x="205" y="82" text-anchor="middle" font-size="6.5" font-weight="600" fill="#bae6fd">(Monitoreo Home Assistant)</text>
  </g>

  <!-- ====================================================================
       2. TREN DE BOMBEO, FILTRADO Y PURIFICACIÓN UV (CUARTO DE MÁQUINAS PB)
       ==================================================================== -->
  <g id="tren-bombeo-cuarto-maquinas" transform="translate(340, 550)">
    <rect x="0" y="0" width="220" height="110" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="110" y="16" text-anchor="middle" font-size="8.5" font-weight="900" fill="#f8fafc">CUARTO DE MÁQUINAS (SISTEMA HIDRÁULICO)</text>

    <!-- Bomba Presurizadora Inverter -->
    <g transform="translate(15, 30)">
      <rect x="0" y="0" width="50" height="35" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="25" cy="17" r="10" fill="#0284c7" />
      <text x="25" y="21" text-anchor="middle" font-size="6" font-weight="900" fill="#ffffff">PUMP</text>
      <text x="25" y="48" text-anchor="middle" font-size="6.5" font-weight="800" fill="#38bdf8">BOMBA INVERTER</text>
      <text x="25" y="58" text-anchor="middle" font-size="5.5" font-weight="600" fill="#94a3b8">3.5 bar Constante</text>
    </g>

    <!-- Filtro de Sedimentos y Carbón -->
    <g transform="translate(85, 30)">
      <rect x="0" y="0" width="30" height="42" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
      <line x1="5" y1="14" x2="25" y2="14" stroke="#10b981" stroke-width="1" />
      <line x1="5" y1="28" x2="25" y2="28" stroke="#10b981" stroke-width="1" />
      <text x="15" y="52" text-anchor="middle" font-size="6" font-weight="800" fill="#10b981">FILTRO DUAL</text>
      <text x="15" y="60" text-anchor="middle" font-size="5" font-weight="600" fill="#94a3b8">5µm + Carbón</text>
    </g>

    <!-- Esterilizador Ultravioleta UV -->
    <g transform="translate(135, 30)">
      <rect x="0" y="0" width="70" height="24" rx="3" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2" />
      <line x1="10" y1="12" x2="60" y2="12" stroke="#c084fc" stroke-width="2" stroke-dasharray="3,2" />
      <text x="35" y="36" text-anchor="middle" font-size="6.5" font-weight="800" fill="#c084fc">LÁMPARA UV (12 GPM)</text>
      <text x="35" y="46" text-anchor="middle" font-size="5.5" font-weight="600" fill="#94a3b8">Desinfección Microbiológica</text>
    </g>

    <!-- Manifold Distribuidor de Agua Fría (AF) -->
    <g transform="translate(15, 75)">
      <rect x="0" y="0" width="190" height="16" rx="2" fill="#0284c7" />
      <text x="95" y="11" text-anchor="middle" font-size="7.5" font-weight="900" fill="#ffffff">MANIFOLD PRINCIPAL AGUA FRÍA (PPR 1")</text>
    </g>
  </g>

  <!-- Conexión Cisterna -> Bomba -->
  <path d="M 270 630 L 355 630 L 355 580" fill="none" stroke="#38bdf8" stroke-width="3" />

  <!-- ====================================================================
       3. CALENTADOR SOLAR DE AGUA 200L & ARREGLO DE TUBOS (AZOTEA +6.00 m)
       ==================================================================== -->
  <g id="calentador-solar-azotea" transform="translate(580, 100)">
    <rect x="0" y="0" width="160" height="40" rx="8" fill="url(#solarTankGrad)" stroke="#cbd5e1" stroke-width="2" />
    <ellipse cx="15" cy="20" rx="6" ry="14" fill="#64748b" />
    <ellipse cx="145" cy="20" rx="6" ry="14" fill="#64748b" />
    <text x="80" y="24" text-anchor="middle" font-size="10" font-weight="900" fill="#0f172a">TERMOTANQUE SOLAR 200 L</text>
    <text x="80" y="34" text-anchor="middle" font-size="6.5" font-weight="700" fill="#334155">Acero Inox 304 Grado Alimenticio • Aislamiento Poliuretano</text>

    <!-- 15 Tubos de Vacío Borosilicato Tricapa -->
    <rect x="15" y="42" width="130" height="45" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <line x1="25" y1="42" x2="25" y2="87" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="40" y1="42" x2="40" y2="87" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="55" y1="42" x2="55" y2="87" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="70" y1="42" x2="70" y2="87" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="85" y1="42" x2="85" y2="87" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="100" y1="42" x2="100" y2="87" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="115" y1="42" x2="115" y2="87" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="130" y1="42" x2="130" y2="87" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Válvula de Alivio P/T y Válvula Anticongelamiento -->
    <circle cx="155" cy="5" r="5" fill="#ef4444" />
    <text x="175" y="8" font-size="6" font-weight="700" fill="#fca5a5">Válvula Alivio P/T (90°C/6 bar)</text>

    <rect x="25" y="92" width="110" height="18" rx="3" fill="#1e293b" stroke="#ea580c" stroke-width="1" />
    <text x="80" y="104" text-anchor="middle" font-size="7" font-weight="900" fill="#fb923c">15 TUBOS VACÍO TRICAPA</text>
  </g>

  <!-- ====================================================================
       4. ESTACIÓN DE MEZCLA, BYPASS TERMOSTÁTICO Y RESPALDO (CUARTO TÉCNICO)
       ==================================================================== -->
  <g id="estacion-bypass-calentador" transform="translate(580, 240)">
    <rect x="0" y="0" width="220" height="95" rx="6" fill="#1e293b" stroke="#ea580c" stroke-width="1.5" />
    <text x="110" y="16" text-anchor="middle" font-size="8.5" font-weight="900" fill="#fb923c">BYPASS INTELIGENTE &amp; RESPALDO MODULANTE</text>

    <!-- Válvula Desviadora Motorizada Smart -->
    <g transform="translate(15, 30)">
      <polygon points="0,0 20,10 0,20" fill="#ea580c" />
      <polygon points="20,10 40,0 40,20" fill="#ea580c" />
      <circle cx="20" cy="10" r="4" fill="#ffffff" />
      <text x="20" y="32" text-anchor="middle" font-size="6" font-weight="800" fill="#fb923c">VÁLVULA 3 VÍAS SMART</text>
      <text x="20" y="42" text-anchor="middle" font-size="5" font-weight="600" fill="#94a3b8">Control Termostático</text>
    </g>

    <!-- Calentador de Respaldo Instantáneo Modulante -->
    <g transform="translate(125, 25)">
      <rect x="0" y="0" width="80" height="42" rx="4" fill="#0f172a" stroke="#f97316" stroke-width="1.2" />
      <text x="40" y="18" text-anchor="middle" font-size="7" font-weight="900" fill="#fb923c">CALENTADOR PASO</text>
      <text x="40" y="28" text-anchor="middle" font-size="5.5" font-weight="700" fill="#ffffff">Modulante (Solo si &lt;42°C)</text>
      <circle cx="20" cy="35" r="3" fill="#10b981" />
      <text x="26" y="37" font-size="5" font-weight="600" fill="#10b981">Auto On/Off</text>
    </g>

    <!-- Manifold de Agua Caliente Sanitaria (ACS) -->
    <g transform="translate(15, 70)">
      <rect x="0" y="0" width="190" height="16" rx="2" fill="#ea580c" />
      <text x="95" y="11" text-anchor="middle" font-size="7.5" font-weight="900" fill="#ffffff">MANIFOLD AGUA CALIENTE SOLAR (PPR TERMOFUSIONADO 3/4")</text>
    </g>
  </g>

  <!-- ====================================================================
       5. SISTEMA DE RECIRCULACIÓN INTELIGENTE "CERO DESPERDICIO"
       ==================================================================== -->
  <g id="sistema-recirculacion" transform="translate(60, 240)">
    <rect x="0" y="0" width="230" height="85" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="115" y="16" text-anchor="middle" font-size="8.5" font-weight="900" fill="#10b981">ANILLO DE RECIRCULACIÓN "CERO DESPERDICIO"</text>

    <!-- Bomba Recirculadora Smart 12W -->
    <g transform="translate(15, 28)">
      <circle cx="18" cy="18" r="14" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
      <path d="M 12 18 A 6 6 0 1 1 24 18" fill="none" stroke="#10b981" stroke-width="2" />
      <text x="40" y="16" font-size="7" font-weight="800" fill="#10b981">BOMBA SMART 12W</text>
      <text x="40" y="26" font-size="5.5" font-weight="600" fill="#94a3b8">Retorno hacia Cisterna / Termotanque</text>
      <text x="40" y="36" font-size="5.5" font-weight="700" fill="#38bdf8">Activa por presencia mmWave en Baño</text>
    </g>

    <rect x="15" y="58" width="200" height="18" rx="2" fill="#065f46" />
    <text x="115" y="70" text-anchor="middle" font-size="6.5" font-weight="800" fill="#ecfdf5">Agua caliente instantánea en 15 seg • Cero litros tirados a la coladera</text>
  </g>

  <!-- ====================================================================
       6. LÍNEAS DE TUBERÍAS Y DISTRIBUCIÓN POR NIVELES
       ==================================================================== -->
  <!-- Columna Vertical de Agua Fría (Sube a Azotea: Azul) -->
  <path d="M 530 550 L 530 120 L 580 120" fill="none" stroke="#0284c7" stroke-width="3.5" filter="url(#glowHydraulic)" />
  <text x="520" y="210" text-anchor="end" font-size="7" font-weight="800" fill="#38bdf8">SUBIDA AGUA FRÍA A AZOTEA (PPR 1") ──►</text>

  <!-- Bajada de Agua Caliente Solar (Baja de Azotea: Naranja) -->
  <path d="M 660 140 L 660 240" fill="none" stroke="#ea580c" stroke-width="3.5" />
  <text x="670" y="190" text-anchor="start" font-size="7" font-weight="800" fill="#fb923c">◄── BAJADA AGUA CALIENTE SOLAR (PPR 3/4" Aislado)</text>

  <!-- Conexión Salida Bypass a Consumos -->
  <path d="M 675 335 L 675 480 L 880 480" fill="none" stroke="#ea580c" stroke-width="3" />
  <path d="M 530 380 L 880 380" fill="none" stroke="#0284c7" stroke-width="3" />

  <!-- Nodos de Consumo en Planta Alta y Planta Baja -->
  <g id="puntos-consumo" transform="translate(720, 360)">
    <rect x="0" y="0" width="190" height="50" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <text x="95" y="16" text-anchor="middle" font-size="7.5" font-weight="800" fill="#f8fafc">CONSUMOS PLANTA ALTA</text>
    <text x="95" y="30" text-anchor="middle" font-size="6.5" font-weight="600" fill="#94a3b8">• Baño Master Spa (Regadera, Doble Vanity, WC)</text>
    <text x="95" y="42" text-anchor="middle" font-size="6.5" font-weight="600" fill="#94a3b8">• Baño Compartido (Regadera, Vanity, WC) • Zinc</text>
  </g>

  <g id="puntos-consumo-pb" transform="translate(720, 460)">
    <rect x="0" y="0" width="190" height="50" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <text x="95" y="16" text-anchor="middle" font-size="7.5" font-weight="800" fill="#f8fafc">CONSUMOS PLANTA BAJA &amp; ROOF</text>
    <text x="95" y="30" text-anchor="middle" font-size="6.5" font-weight="600" fill="#94a3b8">• Baño Suite PB (Regadera, Vanity, WC) • 1/2 Baño PB</text>
    <text x="95" y="42" text-anchor="middle" font-size="6.5" font-weight="600" fill="#94a3b8">• Cocina con Isla • Lavandería • 1/2 Baño Roof Top</text>
  </g>

  <!-- Retorno de Recirculación (Verde) -->
  <path d="M 880 400 L 920 400 L 920 280 L 290 280" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4" />
  <text x="910" y="340" text-anchor="end" font-size="6.5" font-weight="800" fill="#10b981">RETORNO RECIRCULACIÓN (PPR 1/2") ──►</text>

  <!-- LEYENDA TÉCNICA INFERIOR -->
  <g id="leyenda-hidraulica" transform="translate(40, 670)">
    <rect x="0" y="0" width="920" height="22" rx="3" fill="#1e293b" />
    <line x1="20" y1="11" x2="45" y2="11" stroke="#0284c7" stroke-width="3" />
    <text x="50" y="14" font-size="7" font-weight="700" fill="#e2e8f0">Agua Fría Potable (PPR 1")</text>

    <line x1="180" y1="11" x2="205" y2="11" stroke="#ea580c" stroke-width="3" />
    <text x="210" y="14" font-size="7" font-weight="700" fill="#e2e8f0">Agua Caliente Solar (PPR 3/4")</text>

    <line x1="360" y1="11" x2="385" y2="11" stroke="#10b981" stroke-width="2.5" stroke-dasharray="5,3" />
    <text x="390" y="14" font-size="7" font-weight="700" fill="#e2e8f0">Línea de Recirculación Retorno (1/2")</text>

    <circle cx="580" cy="11" r="4" fill="#8b5cf6" />
    <text x="590" y="14" font-size="7" font-weight="700" fill="#e2e8f0">Desinfección UV + Filtración Dual</text>

    <circle cx="760" cy="11" r="4" fill="#f59e0b" />
    <text x="770" y="14" font-size="7" font-weight="700" fill="#e2e8f0">Bypass Termostático Automático</text>
  </g>
</svg>
