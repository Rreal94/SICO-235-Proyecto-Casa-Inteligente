<svg viewBox="0 0 1000 700" width="100%" height="650" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; background-color: #0b1329; border-radius: 12px;">
  <defs>
    <pattern id="gridSanitary" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="0.75" />
    </pattern>
    <linearGradient id="blackWaterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#f87171" />
    </linearGradient>
    <linearGradient id="greyWaterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="rainWaterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="#0b1329" />
  <rect width="1000" height="700" fill="url(#gridSanitary)" />

  <!-- HEADER DEL DIAGRAMA -->
  <g id="header-sanitario" transform="translate(40, 30)">
    <rect x="0" y="0" width="920" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="25" cy="25" r="14" fill="#b91c1c" />
    <path d="M 25 15 L 20 22 L 23 22 L 23 31 L 27 31 L 27 22 L 30 22 Z" fill="#ffffff" />
    <text x="50" y="24" font-size="14" font-weight="900" fill="#f8fafc">DIAGRAMA DE RED SANITARIA, VENTILACIÓN Y DRENAJE PLUVIAL</text>
    <text x="50" y="40" font-size="10" font-weight="600" fill="#94a3b8">Separación de Aguas • Columna de Ventilación Sanitaria (Cero Olores) • Trampas de Grasa • Bajadas Pluviales con Filtro</text>
  </g>

  <!-- LÍNEAS GUÍA DE NIVELES -->
  <g id="niveles-sanitario" opacity="0.4">
    <!-- Nivel Azotea -->
    <line x1="60" y1="170" x2="940" y2="170" stroke="#64748b" stroke-width="1" stroke-dasharray="6,4" />
    <text x="70" y="164" font-size="9" font-weight="800" fill="#34d399">NIVEL +6.00 m (AZOTEA • ROOF GARDEN &amp; REMATE VENTILACIÓN)</text>

    <!-- Nivel Planta Alta -->
    <line x1="60" y1="350" x2="940" y2="350" stroke="#64748b" stroke-width="1" stroke-dasharray="6,4" />
    <text x="70" y="344" font-size="9" font-weight="800" fill="#38bdf8">NIVEL +3.00 m (PLANTA ALTA • NÚCLEO BAÑOS)</text>

    <!-- Nivel Planta Baja -->
    <line x1="60" y1="530" x2="940" y2="530" stroke="#64748b" stroke-width="1" stroke-dasharray="6,4" />
    <text x="70" y="524" font-size="9" font-weight="800" fill="#f87171">NIVEL ±0.00 m (PLANTA BAJA • REGISTROS SANITARIOS)</text>
  </g>

  <!-- ====================================================================
       1. VENTILACIÓN SANITARIA Y DRENAJE DE AZOTEA (+6.00 m)
       ==================================================================== -->
  <g id="azotea-sanitaria" transform="translate(60, 95)">
    <!-- Remate de Ventilación Sanitaria (Sombrero Chino PVC 2") -->
    <g transform="translate(480, 10)">
      <polygon points="20,0 0,15 40,15" fill="#38bdf8" />
      <rect x="14" y="15" width="12" height="30" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="20" y="55" text-anchor="middle" font-size="6.5" font-weight="800" fill="#38bdf8">SOMBRERO VENTILACIÓN</text>
      <text x="20" y="63" text-anchor="middle" font-size="5" font-weight="600" fill="#94a3b8">Remate +7.20 m (Cero Olores)</text>
    </g>

    <!-- Drenaje 1/2 Baño Roof Garden -->
    <g transform="translate(700, 15)">
      <rect x="0" y="0" width="180" height="45" rx="4" fill="#1e293b" stroke="#f87171" stroke-width="1.2" />
      <text x="90" y="16" text-anchor="middle" font-size="7.5" font-weight="800" fill="#f87171">1/2 BAÑO ROOF GARDEN</text>
      <text x="90" y="28" text-anchor="middle" font-size="6" font-weight="600" fill="#e2e8f0">• WC Suspendido 4" (BSN) • Lavabo 2" (BSG)</text>
      <text x="90" y="38" text-anchor="middle" font-size="5.5" font-weight="700" fill="#38bdf8">Conectado a Columna de Ventilación</text>
    </g>

    <!-- Embudo / Coladera Pluvial BAP de Azotea -->
    <g transform="translate(100, 20)">
      <polygon points="0,0 40,0 28,20 12,20" fill="#059669" />
      <text x="20" y="35" text-anchor="middle" font-size="6.5" font-weight="800" fill="#34d399">COLADERA BAP 4"</text>
      <text x="20" y="44" text-anchor="middle" font-size="5.5" font-weight="600" fill="#94a3b8">Pendiente Losa 2%</text>
    </g>
  </g>

  <!-- ====================================================================
       2. PLANTA ALTA - NÚCLEOS HÚMEDOS (+3.00 m)
       ==================================================================== -->
  <g id="pa-sanitaria" transform="translate(60, 260)">
    <!-- Baño Master Spa -->
    <g transform="translate(120, 20)">
      <rect x="0" y="0" width="200" height="55" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1.2" />
      <text x="100" y="16" text-anchor="middle" font-size="8" font-weight="800" fill="#f8fafc">BAÑO MASTER SPA (PLANTA ALTA)</text>
      <text x="100" y="30" text-anchor="middle" font-size="6.5" font-weight="600" fill="#f87171">• Inodoro WC: Descarga directa 4" con codo 45°</text>
      <text x="100" y="42" text-anchor="middle" font-size="6.5" font-weight="600" fill="#94a3b8">• Regadera Spa &amp; Doble Vanity: Coladera 2" con trampa 'P'</text>
    </g>

    <!-- Baño Compartido y Zinc -->
    <g transform="translate(680, 20)">
      <rect x="0" y="0" width="200" height="55" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1.2" />
      <text x="100" y="16" text-anchor="middle" font-size="8" font-weight="800" fill="#f8fafc">BAÑO COMPARTIDO &amp; ZINC</text>
      <text x="100" y="30" text-anchor="middle" font-size="6.5" font-weight="600" fill="#f87171">• WC 4" • Regadera 2" • Vanity 2"</text>
      <text x="100" y="42" text-anchor="middle" font-size="6.5" font-weight="600" fill="#94a3b8">• Zinc de servicio con vertedero 2"</text>
    </g>
  </g>

  <!-- ====================================================================
       3. DUCTO TÉCNICO VERTICAL / SHAFT SANITARIO (COLUMNAS PRINCIPALES)
       ==================================================================== -->
  <!-- Columna de Ventilación Sanitaria CVS 2" (Azul Cielo) -->
  <path d="M 500 140 L 500 520" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="5,3" />
  <text x="490" y="330" text-anchor="end" font-size="7" font-weight="800" fill="#38bdf8">COLUMNA VENTILACIÓN CVS (2") ──►</text>

  <!-- Bajada de Aguas Negras BSN 4" (Rojo) -->
  <path d="M 530 160 L 530 520" fill="none" stroke="#ef4444" stroke-width="4.5" />
  <text x="540" y="240" text-anchor="start" font-size="7" font-weight="800" fill="#f87171">◄── BAJADA AGUAS NEGRAS BSN (PVC 4")</text>

  <!-- Bajada de Aguas Grises BSG 3" (Gris) -->
  <path d="M 560 160 L 560 520" fill="none" stroke="#94a3b8" stroke-width="3.5" />
  <text x="570" y="420" text-anchor="start" font-size="7" font-weight="800" fill="#cbd5e1">◄── BAJADA AGUAS GRISES BSG (PVC 3")</text>

  <!-- Bajada Pluvial BAP 4" (Verde) -->
  <path d="M 120 160 L 120 520" fill="none" stroke="#10b981" stroke-width="4" />
  <text x="130" y="380" text-anchor="start" font-size="7" font-weight="800" fill="#34d399">◄── BAJADA AGUA PLUVIAL BAP (4")</text>

  <!-- ====================================================================
       4. PLANTA BAJA - REGISTROS SANITARIOS Y TRAMPAS (±0.00 m)
       ==================================================================== -->
  <g id="pb-sanitaria" transform="translate(60, 530)">
    <!-- Trampa de Grasas Cocina -->
    <g transform="translate(180, 20)">
      <rect x="0" y="0" width="80" height="35" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="40" y="16" text-anchor="middle" font-size="6.5" font-weight="800" fill="#fbbf24">TRAMPA GRASAS</text>
      <text x="40" y="26" text-anchor="middle" font-size="5.5" font-weight="600" fill="#94a3b8">Cocina / Tarja Isla</text>
    </g>

    <!-- Trampa de Pelusas Lavandería -->
    <g transform="translate(680, 20)">
      <rect x="0" y="0" width="85" height="35" rx="3" fill="#1e293b" stroke="#60a5fa" stroke-width="1.2" />
      <text x="42" y="16" text-anchor="middle" font-size="6.5" font-weight="800" fill="#93c5fd">TRAMPA PELUSAS</text>
      <text x="42" y="26" text-anchor="middle" font-size="5.5" font-weight="600" fill="#94a3b8">Lavadora &amp; Secadora</text>
    </g>

    <!-- Registro Sanitario 1 (Zona Posterior: 40x40 cm) -->
    <g transform="translate(300, 20)">
      <rect x="0" y="0" width="55" height="40" rx="3" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
      <text x="27.5" y="18" text-anchor="middle" font-size="7" font-weight="900" fill="#f87171">REG. 1 (R-1)</text>
      <text x="27.5" y="30" text-anchor="middle" font-size="5.5" font-weight="600" fill="#e2e8f0">40x40 cm Ciego</text>
    </g>

    <!-- Registro Sanitario 2 (Zona Media: 40x60 cm) -->
    <g transform="translate(510, 15)">
      <rect x="0" y="0" width="70" height="48" rx="3" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
      <text x="35" y="20" text-anchor="middle" font-size="7.5" font-weight="900" fill="#f87171">REG. 2 (R-2)</text>
      <text x="35" y="32" text-anchor="middle" font-size="6" font-weight="700" fill="#ffffff">Doble Sello Herm.</text>
      <text x="35" y="42" text-anchor="middle" font-size="5" font-weight="600" fill="#94a3b8">Conexión Shaft</text>
    </g>

    <!-- Registro Sanitario 3 (Cochera / Banqueta: 60x60 cm) -->
    <g transform="translate(790, 15)">
      <rect x="0" y="0" width="75" height="48" rx="3" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
      <text x="37.5" y="18" text-anchor="middle" font-size="8" font-weight="900" fill="#f87171">REG. 3 (GENERAL)</text>
      <text x="37.5" y="30" text-anchor="middle" font-size="6" font-weight="700" fill="#ffffff">60x60 cm Sifónico</text>
      <text x="37.5" y="40" text-anchor="middle" font-size="5.5" font-weight="600" fill="#38bdf8">Salida Municipal 6"</text>
    </g>

    <!-- Conexiones Colectoras Subterráneas (Pendiente 2%) -->
    <path d="M 355 40 L 510 40" fill="none" stroke="#ef4444" stroke-width="4" />
    <path d="M 580 40 L 790 40" fill="none" stroke="#ef4444" stroke-width="4" />
    <path d="M 865 40 L 920 40" fill="none" stroke="#ef4444" stroke-width="5" />
    <text x="680" y="55" text-anchor="middle" font-size="6" font-weight="800" fill="#fca5a5">◄── COLECTOR GENERAL PVC 6" (PENDIENTE 2.0%) ──►</text>
  </g>

  <!-- LEYENDA TÉCNICA INFERIOR -->
  <g id="leyenda-sanitaria" transform="translate(40, 670)">
    <rect x="0" y="0" width="920" height="22" rx="3" fill="#1e293b" />
    <line x1="20" y1="11" x2="45" y2="11" stroke="#ef4444" stroke-width="3.5" />
    <text x="50" y="14" font-size="7" font-weight="700" fill="#e2e8f0">Aguas Negras BSN (PVC 4")</text>

    <line x1="180" y1="11" x2="205" y2="11" stroke="#94a3b8" stroke-width="3" />
    <text x="210" y="14" font-size="7" font-weight="700" fill="#e2e8f0">Aguas Grises BSG (PVC 3")</text>

    <line x1="340" y1="11" x2="365" y2="11" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,2" />
    <text x="370" y="14" font-size="7" font-weight="700" fill="#e2e8f0">Columna Ventilación CVS (PVC 2")</text>

    <line x1="530" y1="11" x2="555" y2="11" stroke="#10b981" stroke-width="3.5" />
    <text x="560" y="14" font-size="7" font-weight="700" fill="#e2e8f0">Bajada Pluvial BAP (PVC 4")</text>

    <circle cx="720" cy="11" r="4" fill="#f59e0b" />
    <text x="730" y="14" font-size="7" font-weight="700" fill="#e2e8f0">Trampas de Grasas &amp; Pelusas</text>
  </g>
</svg>
